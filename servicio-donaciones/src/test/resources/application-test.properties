# Configuración exclusiva para pruebas (perfil "test"): H2 en memoria en modo de
# compatibilidad MySQL. Evita depender de un servidor MySQL real para los tests.
spring.datasource.url=jdbc:h2:mem:donaciones_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Properties de negocio necesarias para levantar el contexto completo en los
# @SpringBootTest sin depender de servicios externos reales.
services.incentivos.url=http://localhost:8081/incentivos
services.logistica.url=http://localhost:8084

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
