spring.application.name=donatrack

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Conexion a la base de datos por variables de entorno (base desplegada en TiDB
# Cloud). Los valores por defecto permiten el arranque local, pero las
# credenciales reales deben inyectarse por entorno (no versionar secretos).
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.sa-east-1.prod.aws.tidbcloud.com:4000/donatrack?sslMode=VERIFY_IDENTITY}
spring.datasource.username=${DB_USER:48EMsmYEtkL6YCy.root}
spring.datasource.password=${DB_PASSWORD:}

# create: recrea el esquema borrando los datos en cada arranque.
# update: conserva los datos. En entornos compartidos usar 'update' o 'validate'.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

services.incentivos.url=http://localhost:8081/incentivos
services.logistica.url=http://localhost:8084

spring.rabbitmq.addresses=${SPRING_RABBITMQ_ADDRESSES:amqps://pwdenkbw:4GWL976LhyPlrHBZi45I_MjAdzA6RLGN@jaragua.lmq.cloudamqp.com/pwdenkbw}

#Rabbit MQ local
#spring.rabbitmq.host=localhost
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=guest
#spring.rabbitmq.password=guest
spring.mvc.converters.preferred-json-mapper=jackson
# Cron de envio de lotes a logistica. Se puede acelerar en pruebas con
# la variable de entorno DONATRACK_CRON_DONACIONESLISTAS (ej: "0 * * * * *").
donatrack.cron.donaciones-listas=0 0 8 * * *
