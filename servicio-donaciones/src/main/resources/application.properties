spring.application.name=donatrack

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Persistencia JPA (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donatrack_donaciones?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=${DB_USER:donatrack}
spring.datasource.password=${DB_PASSWORD:donatrack}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

services.incentivos.url=http://localhost:8081/incentivos
services.logistica.url=http://localhost:8084

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.mvc.converters.preferred-json-mapper=jackson
# Cron de envio de lotes a logistica. Se puede acelerar en pruebas con
# la variable de entorno DONATRACK_CRON_DONACIONESLISTAS (ej: "0 * * * * *").
donatrack.cron.donaciones-listas=0 0 8 * * *
