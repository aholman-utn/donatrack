server.port=8084

app.logistica.local-url=http://localhost:8083

spring.cloud.gateway.routes[0].id=logistica-route
spring.cloud.gateway.routes[0].uri=https://servicio-logistica-latest.onrender.com
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/logistica/**

spring.cloud.gateway.routes[0].filters[0].name=CacheRequestBody
spring.cloud.gateway.routes[0].filters[0].args.bodyClass=java.lang.String

spring.cloud.gateway.routes[0].filters[1].name=CircuitBreaker
spring.cloud.gateway.routes[0].filters[1].args.name=logisticaCB
spring.cloud.gateway.routes[0].filters[1].args.fallbackUri=forward:/fallback/logistica
spring.cloud.gateway.routes[0].filters[1].args.statusCodes=403,500,502,503,504

# --- [1] RUTA IAM (Autenticación) ---
spring.cloud.gateway.routes[1].id=iam-route
spring.cloud.gateway.routes[1].uri=http://localhost:8085
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/auth/**,/api/users/**

# --- [2] DONACIONES ---
spring.cloud.gateway.routes[2].id=donaciones-route
spring.cloud.gateway.routes[2].uri=http://localhost:8080
spring.cloud.gateway.routes[2].predicates[0]=Path=/donantes/**,/donaciones/**,/donaciones-segmentadas/**,/entidadBeneficiaria/**,/api/necesidades

# --- [3] RUTA INCENTIVOS ---
spring.cloud.gateway.routes[3].id=incentivos-route
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/incentivos/**

# --- [4] RUTA NOTIFICACIONES (n8n / RabbitMQ) ---
spring.cloud.gateway.routes[4].id=notificaciones-route
spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/notificaciones/**

# --- RESILIENCE4J CONFIG ---
resilience4j.timelimiter.instances.logisticaCB.timeoutDuration=45s
resilience4j.circuitbreaker.instances.logisticaCB.slidingWindowSize=5
resilience4j.circuitbreaker.instances.logisticaCB.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.record-exceptions=org.springframework.web.client.HttpServerErrorException

# --- CORS CONFIG ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

