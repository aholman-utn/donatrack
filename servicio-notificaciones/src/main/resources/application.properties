server.port=8082
spring.application.name=servicio-notificaciones
server.error.include-binding-errors=always
server.error.include-message=always

# SMS Provider: "simulacion" (default) o "vonage"
sms.provider=${SMS_PROVIDER:simulacion}

# Vonage (solo necesario si sms.provider=vonage)
vonage.api-key=${VONAGE_API_KEY:}
vonage.api-secret=${VONAGE_API_SECRET:}
vonage.from-number=${VONAGE_FROM_NUMBER:}