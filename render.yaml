# Render Blueprint - DonaTrack
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: donatrack-donaciones
    runtime: docker
    dockerfilePath: ./Dockerfile.donaciones
    branch: main
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Conexión a la base de datos (MySQL gestionado). Cargar los valores
      # reales en el dashboard de Render; no se versionan por seguridad.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DDL_AUTO
        value: validate

  - type: web
    name: donatrack-incentivos
    runtime: docker
    dockerfilePath: ./Dockerfile.incentivos
    branch: main
    plan: free
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: prod

  - type: web
    name: donatrack-notificaciones
    runtime: docker
    dockerfilePath: ./Dockerfile.notificaciones
    branch: main
    plan: free
    envVars:
      - key: PORT
        value: 8082
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Conexión a la base de datos (MySQL gestionado). Cargar los valores
      # reales en el dashboard de Render; no se versionan por seguridad.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DDL_AUTO
        value: validate
